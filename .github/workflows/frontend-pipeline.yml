name: Medicine Frontend CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    env:
      DEPLOY_TAG: 'uat'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env file
        working-directory: ./frontend
        run: echo "${{ secrets.FRONTEND_ENV || secrets.DEVELOP_ENV }}" > .env

      - name: Build and Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v6.3
        with:
          registry: ghcr.io
          directory: frontend
          dockerfile: frontend/Dockerfile
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}
          image: ghcr.io/posdapal/medicine_inventory_system_frontend
          tags: ${{ env.DEPLOY_TAG }}
          buildArgs: DEPLOY_TAG=${{ env.DEPLOY_TAG }},VITE_API_URL=${{ secrets.VITE_API_URL }}

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Copy Docker Compose to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WEB_SERVER_SSH_HOST }}
          username: ${{ secrets.WEB_SERVER_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.WEB_SERVER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.WEB_SERVER_SSH_PORT || 22 }}
          source: "frontend/docker-compose.yml"
          target: "~/app/frontend"
          strip_components: 1

      - name: Deploy with Docker Compose via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY_TOKEN: ${{ secrets.TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.USERNAME }}
          IMAGE_URI: ghcr.io/${{ secrets.USERNAME }}/ccu-medicine-frontend:uat
        with:
          host: ${{ secrets.WEB_SERVER_SSH_HOST }}
          username: ${{ secrets.WEB_SERVER_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.WEB_SERVER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.WEB_SERVER_SSH_PORT || 22 }}
          envs: REGISTRY_TOKEN,REGISTRY_USERNAME,IMAGE_URI
          script: |
            cd ~/app/frontend
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
            export IMAGE_URI="$IMAGE_URI"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
